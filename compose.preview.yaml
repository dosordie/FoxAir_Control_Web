services:
  foxair-web:
    image: ${FOXAIR_PREVIEW_IMAGE:-ghcr.io/dosordie/foxair-control-web:0.1.1-preview}
    network_mode: host
    init: true
    command: [python, -m, backend.server, --host, 0.0.0.0, --port, '18081']
    environment:
      FOXAIR_LAN_HTTP: '1'
    volumes:
      - preview-state:/var/lib/foxair-web
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/api/health', timeout=3).close()"]

volumes:
  preview-state:
