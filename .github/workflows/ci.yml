name: FoxAir Web CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Verify register catalogue snapshot
        run: |
          python - <<'PY'
          from backend.catalog import load_registers, search_registers
          regs = load_registers()
          assert len(regs) > 500, f"Registerkatalog zu klein: {len(regs)}"
          assert any(x["register"] == 1158 for x in search_registers("R02"))
          print("Register:", len(regs))
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
