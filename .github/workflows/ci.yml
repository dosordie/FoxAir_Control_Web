name: FoxAir Web CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Check shell deployment scripts
        run: bash -n scripts/update.sh scripts/install_service.sh scripts/install_web_update.sh scripts/set_trusted_proxy.sh scripts/set_listen_address.sh
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Verify register catalogue snapshot
        run: |
          python - <<'PY'
          from backend.catalog import load_registers, search_registers
          regs = load_registers()
          assert len(regs) > 500, f"Registerkatalog zu klein: {len(regs)}"
          assert any(x["register"] == 1158 for x in search_registers("R02"))
          print("Register:", len(regs))
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned FoxAir_Control catalog
        uses: actions/checkout@v4
        with:
          repository: dosordie/FoxAir_Control
          ref: 34ce0ed5b1152456af3c7b33bf47e6d31e76a965
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export source-backed cloud catalog
        run: python scripts/export_cloud_catalog.py upstream frontend/public/cloud_catalog.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm test && npm run build
      - name: Upload prebuilt PWA for Linux server installation
        uses: actions/upload-artifact@v4
        with:
          name: foxair-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish prebuilt frontend to git branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: foxair-frontend-dist-branch
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foxair-frontend-dist
          path: prebuilt
      - name: Publish clean assets + exact source revision to web-dist branch
        shell: bash
        run: |
          set -euo pipefail
          test -f prebuilt/index.html
          build_dir="$(mktemp -d)"
          cp -a prebuilt/. "$build_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$build_dir/.build-source-sha"
          git -C "$build_dir" init -q --initial-branch=web-dist
          git -C "$build_dir" config user.name "github-actions[bot]"
          git -C "$build_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$build_dir" add -A
          git -C "$build_dir" commit -qm "build: frontend from $GITHUB_SHA"
          git -C "$build_dir" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          git -C "$build_dir" -c "http.https://github.com/.extraheader=$auth_header" \
            push -q --force origin HEAD:refs/heads/web-dist
