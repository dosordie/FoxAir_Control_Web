name: Manual Docker verification (no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve pinned catalog
        id: upstream
        run: python -c "import json,os; r=json.load(open('data/upstream.json'))['ref']; open(os.environ['GITHUB_OUTPUT'],'a').write('ref='+r+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: dosordie/FoxAir_Control
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream
          persist-credentials: false
      - name: Export pinned catalog
        run: python scripts/export_cloud_catalog.py upstream frontend/public/cloud_catalog.json
      - name: Build self-contained image
        run: docker build --build-arg FOXAIR_VERSION="$(cat VERSION)" --build-arg FOXAIR_SOURCE_SHA="$GITHUB_SHA" --label org.opencontainers.image.version="$(cat VERSION)" --label org.opencontainers.image.revision="$GITHUB_SHA" -t foxair-web:manual .
      - name: Verify isolated installation
        run: bash scripts/smoke_docker.sh foxair-web:manual
